<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SOFA 2026 Logistics Dashboard</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">TRRNGR / Click on Design S.A.S.</p>
        <h1>SOFA 2026 Logistics Dashboard</h1>
      </div>
      <span class="badge">Synthetic Public Version</span>
    </header>

    <main>
      <section class="metrics" id="metrics"></section>

      <section class="dashboard-grid">
        <div class="panel">
          <h2>Operational Status</h2>
          <div id="statusChart" class="bars"></div>
        </div>
        <div class="panel">
          <h2>Pavilion Readiness</h2>
          <div id="pavilionChart" class="bars"></div>
        </div>
      </section>

      <section class="panel">
        <div class="table-header">
          <h2>Audit Sample</h2>
          <select id="statusFilter" aria-label="Operational status filter">
            <option value="">All statuses</option>
          </select>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Pavilion</th>
                <th>Module</th>
                <th>Requirement</th>
                <th>Level</th>
                <th>Verified</th>
                <th>Urgent</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="recordsBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
